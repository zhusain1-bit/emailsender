[google_sheets]
# Your Google Sheet ID (from the URL)
sheet_id = 1MR97uu4_42e9gKcI2Keu0FvBz01MawxwDDCIh6VPoRY

# The name of the tab/sheet to read from
sheet_name = Sheet3

# Column header names in your spreadsheet (update these to match exactly)
col_first_name = First Name
col_last_name = Last Name
col_email = Person Email
col_company = Company
col_role = Role
col_done = Done

# Path to your Google Sheets API service account credentials JSON file
credentials_file = credentials.json

[sendgrid]
# SendGrid API key (get one at https://app.sendgrid.com/settings/api_keys)
# DO NOT commit this file with a real API key — use environment variable instead
# If left as "ENV", the script will check the SENDGRID_API_KEY env variable
api_key = ENV

# The "From" email address (must be verified in SendGrid — see README)
sender_email = YOUR_EMAIL@babson.edu

[template]
# Path to the email template file
template_file = template.txt

# Email subject line — supports the same {variables} as the template body
subject = Babson Student Interested in {company}

[scheduling]
# Time to run daily (24-hour format HH:MM)
run_time = 09:00

# Timezone (e.g., America/New_York, America/Chicago, UTC)
timezone = America/New_York

[logging]
# Path to the log file for sent emails
log_file = email_log.csv

[safety]
# Confirmation mode: "each" = confirm before every email, "batch" = confirm once for all
confirmation_mode = each

# Delay between emails in seconds (to avoid rate limiting)
delay_between_emails = 5
